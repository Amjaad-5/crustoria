    <!--to create an HTML table-->
    <h2>HTML Tables</h2>
    <table>
        <tbody><tr>
            <th>Days</th>
            <th>Weather</th>
        </tr>
        <tr>
            <td>Sunday</td>
            <td>Sunny</td>
        </tr>
        <tr>
            <td>Monday</td>
            <td>spring</td>
        </tr>

    </tbody></table>

    <!--Creating an HTML form-->
    <h2>An HTML Form</h2>
    <form action="file:///C:/Users/hashmeya.barakat/Documents/STREAM%232/Tables_And_Forms.html" method="post" target="_blank">
        <!--To add an email textfield with its label-->
        <label>
            Email
            <br>
            <input type="text" name="email" id="email">
        </label>
            <br>
        <label>
            Subject
            <br>
            <input type="text" name="subject" id="subject">
        </label>
        <br>
        <!--add an Age field with its label-->
        <br>
        <label>
            Age
            <br><input type="number" name="age" id="age">
        </label>
        <!--to add a date of birth field with its label-->

        <br>
        
        <br>
        <label>
        Date of birth
        <br><input type="date" name="dob" id="dob">
        </label>
        <!--To add gender radio buttons grouped in a fieldset-->
        <br><fieldset>
            <legend>Gender</legend>
            <label>
                Female
                <input type="radio" name="gender" id="female" value="female">
            </label>
        </fieldset>
        <br><label>
            Description
            <br>
            <textarea name="description" id="description" cols="50" rows="3">            </textarea>

        </label>
        <br>
        <input type="submit" value="Submit Request">

    </form>
